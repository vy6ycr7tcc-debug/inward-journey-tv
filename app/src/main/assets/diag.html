<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inward Journey TV — Diagnostics</title>
<style>
  html, body { margin:0; padding:0; background:#05070f; color:#e8e4d8;
    font-family: sans-serif; font-size:28px; }
  #wrap { padding:48px; max-width:1600px; }
  h1 { font-size:44px; color:#d8a93f; margin-top:0; }
  .row { margin:14px 0; word-break:break-word; }
  .k { color:#8fa3c7; }
  .ok { color:#7fd67f; font-weight:bold; }
  .no { color:#e06c6c; font-weight:bold; }
  #fps { font-size:36px; margin-top:28px; }
  .hint { margin-top:36px; color:#8fa3c7; font-size:22px; }
</style>
</head>
<body>
<div id="wrap">
  <h1>Inward Journey TV — diagnostics</h1>
  <div id="out"><div class="row">Running checks…</div></div>
  <div id="fps"></div>
  <div class="hint">Press any remote key to re-run. Results are also sent to logcat (tag InwardJourneyTv).</div>
</div>
<script>
(function () {
  var out = document.getElementById('out');
  var fpsEl = document.getElementById('fps');
  var results = {};

  function row(k, v, cls) {
    return '<div class="row"><span class="k">' + k + ':</span> ' +
      (cls ? '<span class="' + cls + '">' + v + '</span>' : v) + '</div>';
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  }

  function webviewVersion() {
    var m = navigator.userAgent.match(/Chrome\/([\d.]+)/);
    return m ? m[1] : 'unknown';
  }

  async function webgpu() {
    if (!navigator.gpu) return { supported: false, reason: 'navigator.gpu missing' };
    try {
      var adapter = await navigator.gpu.requestAdapter();
      if (!adapter) return { supported: false, reason: 'requestAdapter() returned null' };
      var info = {};
      try {
        if (adapter.requestAdapterInfo) info = await adapter.requestAdapterInfo();
        else if (adapter.info) info = adapter.info;
      } catch (e) { info.note = 'adapter info unavailable: ' + e.message; }
      return { supported: true, info: info };
    } catch (e) {
      return { supported: false, reason: String((e && e.message) || e) };
    }
  }

  function webgl2() {
    try {
      var c = document.createElement('canvas');
      var gl = c.getContext('webgl2');
      if (!gl) return { supported: false };
      var dbg = gl.getExtension('WEBGL_debug_renderer_info');
      var renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
      return { supported: true, renderer: renderer };
    } catch (e) { return { supported: false, reason: String(e) }; }
  }

  function fpsMeter(done) {
    var frames = 0, start = performance.now();
    function tick() {
      frames++;
      if (performance.now() - start < 3000) requestAnimationFrame(tick);
      else done((frames / ((performance.now() - start) / 1000)).toFixed(1));
    }
    requestAnimationFrame(tick);
  }

  async function run() {
    out.innerHTML = '<div class="row">Running checks…</div>';
    fpsEl.textContent = '';
    var gpu = await webgpu();
    var gl = webgl2();
    results = {
      userAgent: navigator.userAgent,
      webviewChromium: webviewVersion(),
      devicePixelRatio: window.devicePixelRatio,
      cores: navigator.hardwareConcurrency || 'unknown',
      webgpu: gpu,
      webgl2: gl
    };

    var html = '';
    html += row('Chromium/WebView', esc(webviewVersion()));
    html += row('WebGPU',
      gpu.supported ? 'AVAILABLE ' + esc(JSON.stringify(gpu.info || {}))
                    : 'NOT available — ' + esc(gpu.reason || ''),
      gpu.supported ? 'ok' : 'no');
    html += row('WebGL2 fallback',
      gl.supported ? 'available (' + esc(gl.renderer) + ')' : 'NOT available',
      gl.supported ? 'ok' : 'no');
    html += row('Device pixel ratio', esc(window.devicePixelRatio));
    html += row('CPU cores', esc(navigator.hardwareConcurrency || 'unknown'));
    out.innerHTML = html;

    fpsMeter(function (fps) {
      fpsEl.innerHTML = '<span class="k">Baseline rAF:</span> ' + esc(fps) +
        ' fps <span class="k">(empty page — the game will be lower)</span>';
      results.baselineFps = fps;
      try {
        if (window.TvBridge && TvBridge.report) TvBridge.report(JSON.stringify(results));
      } catch (e) { /* bridge optional */ }
    });
  }

  document.addEventListener('keydown', run);
  run();
})();
</script>
</body>
</html>
