plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'app.inwardjourney.tv'
    compileSdk 34

    defaultConfig {
        applicationId "app.inwardjourney.tv"
        minSdk 28
        targetSdk 34
        versionCode 5
        versionName "2.2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        // BuildConfig.DEBUG is used to gate chrome://inspect in debug builds.
        buildConfig true
    }
}

// Zero external dependencies: platform APIs only.
dependencies {
}
